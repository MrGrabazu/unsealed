[package]
name = "data-builder"
version = "0.1.0"
edition = "2021"
description = "Builds the compact per-set data files, prices and manifest published for the Unsealed client"

[dependencies]
unsealed-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
ureq = "2"
flate2 = "1"
