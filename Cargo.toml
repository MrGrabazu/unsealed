[workspace]
members = ["core", "data-builder", "app/src-tauri"]
resolver = "2"

# The data build (JSON parsing, decompression, booster simulations) is far too slow
# unoptimized, and the app runs it in the background even in debug builds.
[profile.dev.package.unsealed-core]
opt-level = 3
# Optimized and incremental, rustc sometimes leaves the core's library with unresolved
# `anon.*.llvm.*` symbols after an edit (link errors until a `cargo clean`).
incremental = false
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.rand_chacha]
opt-level = 3
# The image cache's thumbnails (decoding, resizing, encoding a JPEG): unoptimized, each one took
# long enough for the cards of an opening's summary to stay black a while.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3

# The released game: a smaller and faster binary, for a longer build. Panics still unwind:
# the background data refresh relies on it to never take the game down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
