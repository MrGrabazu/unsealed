[package]
name = "unsealed-app"
version = "1.0.2"
edition = "2021"
description = "Unsealed desktop app (Tauri shell around unsealed-core)"
license = "GPL-3.0-or-later"

[lib]
name = "unsealed_app_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
rand_chacha = "0.3"
unsealed-core = { path = "../../core" }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# The WebView2 controller, to lower its memory target while the window is minimized (the
# versions wry uses).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
