[package]
name = "unsealed-app"
version = "0.1.0"
edition = "2021"
description = "Unsealed desktop app (Tauri shell around unsealed-core)"

[lib]
name = "unsealed_app_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
unsealed-core = { path = "../../core" }
